<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome </title>
    <style>
        /* General Page Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0e0e0e;
            color: white;
            text-align: center;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Animated Background */
        .background {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(45,45,45,1) 0%, rgba(0,0,0,1) 100%);
            overflow: hidden;
        }

        /* Floating Particles */
        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            opacity: 0.3;
            animation: float 8s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0.1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0.8; }
        }

        /* Content Section */
        .content {
            position: relative;
            z-index: 2;
            animation: fadeIn 2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.2rem;
            opacity: 0.8;
        }

        /* GitHub Button */
        .github-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #6cc644;
            color: black;
            font-weight: bold;
            text-decoration: none;
            border-radius: 5px;
            transition: 0.3s ease;
        }

        .github-btn:hover {
            background: #57a036;
        }

    </style>
</head>
<body>

    <div class="background"></div>

    <div class="content">
        <h1>Welcome to My GitHub</h1>
        <p>Exploring, researching, and developing new projects.</p>
        <a class="github-btn" href="https://github.com/versionsixnine" target="_blank">Visit My GitHub</a>
    </div>

    <script>
        // Create floating particles
        function createParticles() {
            const background = document.querySelector(".background");
            for (let i = 0; i < 30; i++) {
                let particle = document.createElement("div");
                particle.classList.add("particle");
                let size = Math.random() * 10 + 3;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${Math.random() * 100}vw`;
                particle.style.animationDuration = `${Math.random() * 5 + 5}s`;
                background.appendChild(particle);
            }
        }
        createParticles();
    </script>

</body>
</html>
